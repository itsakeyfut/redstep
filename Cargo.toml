[workspace]
resolver = "2"
members = ["crates/redstep", "crates/redstep-macros"]
# The playground targets (#47) are deliberately vulnerable fixtures built only as
# Docker images, never by the gate: excluded so the framework's own lints never
# see their raw-concat SQL and so their deps stay out of the workspace lockfile.
exclude = ["playground"]

# unsafe is off by default across the tree; a future -sys binding or raw-socket
# primitive opts a single module back in. See docs/rules/unsafe.md.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/itsakeyfut/redstep"

# redstep depends on redstep-macros by path. The `version` is what lets `redstep`
# be published: `cargo publish` refuses a path-only dependency, because a crate on
# crates.io cannot resolve a sibling by filesystem path. Lockstep (both crates share
# `[workspace.package].version`), so this pin tracks that version and a release moves
# both together. Declared here rather than in the crate so the version lives in one
# place, the same root manifest the release workflow watches for a version bump.
[workspace.dependencies]
redstep-macros = { path = "crates/redstep-macros", version = "0.2.0" }
