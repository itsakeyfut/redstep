[package]
name = "redstep-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# crates.io requires a description; this crate is the framework's macro support,
# not a standalone tool, so the description points back at redstep.
description = "Procedural macros for the redstep security-testing framework."
keywords = ["security", "testing", "macros", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.87", features = ["full"] }
quote = "1.0.37"
proc-macro2 = "1.0.89"
