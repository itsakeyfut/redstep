[package]
name = "redstep-playground-web"
version = "0.1.0"
edition = "2021"
publish = false

# The binary is copied as `/app` by the Dockerfile and run as the entrypoint and
# the HEALTHCHECK (`/app healthcheck`).
[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
# A tiny blocking HTTP server; the forwarder needs no async runtime or client
# crate (it relays over a hand-rolled TCP GET).
tiny_http = "0.12.0"
