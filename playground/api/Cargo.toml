[package]
name = "redstep-playground-api"
version = "0.1.0"
edition = "2021"
publish = false

# The binary is copied as `/app` by the Dockerfile and run as the entrypoint and
# the HEALTHCHECK (`/app healthcheck`).
[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
# A tiny blocking HTTP server; the fixture needs no async runtime of its own.
tiny_http = "0.12.0"
# The synchronous postgres client, used through `simple_query` so the raw
# (unparameterized) SQL string runs as-is: that is the vulnerability.
postgres = "0.19.7"
