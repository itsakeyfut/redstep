[package]
name = "redstep-playground-api"
version = "0.1.0"
edition = "2021"
publish = false

# The binary is copied as `/app` by the Dockerfile and run as the entrypoint and
# the HEALTHCHECK (`/app healthcheck`).
[[bin]]
name = "app"
path = "src/main.rs"

# `fixed` builds the patched variant (redstep/api:fixed, #54): `/lookup` runs a
# parameterized query instead of the string-concatenated one. Default-off, so the
# plain build is the vulnerable mvp image. Adds no dependency.
[features]
fixed = []

[dependencies]
# A tiny blocking HTTP server; the fixture needs no async runtime of its own.
tiny_http = "0.12.0"
# The synchronous postgres client. The default build runs `/lookup` through
# `simple_query` with the raw SQL string, which is the vulnerability; the `fixed`
# build runs a parameterized `query` instead.
postgres = "0.19.7"
# A template engine for `/render` (#90): the default build renders the caller's
# input as the template source, which is the SSTI; the `fixed` build renders a
# fixed template with the input bound as data. An unconditional dependency (both
# builds use it), so `Cargo.lock` holds for the default and `--features fixed`.
minijinja = "3.0.1"
