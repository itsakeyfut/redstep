name: Task
description: A unit of work inside a milestone, filed with that milestone's batch or discovered while implementing it.
title: "feat: "
labels: ["T-Feat"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are filed a milestone at a time, as one coherent batch taken from
        `docs/roadmap/roadmap.md`, gathered under a parent tracking issue. More
        get filed as implementing the milestone turns up work that was not
        foreseen. The next milestone's batch is not filed until this one is
        closed out.

        That is what keeps an issue from becoming a second, drifting copy of the
        roadmap: the batch's lifetime is the milestone's. A backlog with no such
        bound would drift, and two copies of one thing that disagree is exactly
        the failure the docs split under `docs/specs/` and `docs/roadmap/` was
        made to avoid.

        Set the milestone (`v0.1.0` and up). Each milestone's description carries
        the condition that closes it, so "is this finished" is a fact GitHub can
        answer. `docs/roadmap/roadmap.md` holds the order; an issue may belong to
        a later milestone than the one being worked on.

        Add one status label when you file this, and it is a judgement you make
        rather than a default: `S-Needs-Design` if anything about how to build it
        is still open, `S-Ready-For-Implementation` if it is small and the design
        is already settled. The first runs `/spec`; the second goes straight to
        `/impl`. When in doubt it is the first, because `/spec` finding nothing to
        decide costs a few minutes and `/impl` discovering a decision mid-change
        costs the decision being made by whoever was typing. Anything touching a
        verdict, scope, or isolation is `S-Needs-Design` by default: those are
        where a quiet choice becomes a false PASS or an escape from the lab.

  - type: input
    id: milestone
    attributes:
      label: Milestone and roadmap line
      description: Which milestone this belongs to, and which line of `docs/roadmap/roadmap.md` it expands.
      placeholder: "M1 (v0.1.0): the scope gate and runner lines"
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: Origin
      description: >
        Filed with the batch, or turned up while implementing it. Worth
        recording: how much of a milestone was unforeseen is the most useful
        thing to know when planning the next one.
      options:
        - Planned with the milestone
        - Found while implementing the milestone
    validations:
      required: true

  - type: input
    id: depends
    attributes:
      label: Depends on
      description: >
        Issues in this batch that have to land first, if any. A batch is one
        piece of work split up, so the order inside it is part of the plan.
      placeholder: "#12, #13"

  - type: textarea
    id: premise
    attributes:
      label: Premise
      description: >
        What is true in the code today that makes this needed. State something
        checkable: implementation reads the code and confirms it first, because
        a premise the code has already overtaken changes what the work is.
      placeholder: |
        `Scope` is a bare `Vec<String>` and nothing resolves a target through it;
        a capability takes a raw `&str` host, so there is no gate between an
        address and an action.
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: What to build
      description: >
        The shape of it. Which files, and which existing pattern to follow. If
        it touches a verdict, scope, isolation, or evidence, name the decision in
        `docs/specs/design-decisions.md` it implements.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        A checklist, each item checkable by someone who did not write it. Every
        one ends the work explicitly met, deferred, or relocated. That
        reconciliation is why they are written down: silence is how the seventh
        item goes missing.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: How it is proven
      description: >
        Which test or command, and what its output has to say. A guard here is
        real only when breaking the code makes a named test fail, so name the
        mutation if you already know it.
      placeholder: |
        `cargo test scope::`, plus a fixture target under `tests/fixtures/`.
        Removing the default-deny branch makes an empty scope allow every target
        and fails `empty_scope_should_allow_nothing`.
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: >
        What this deliberately does not do, including which later issue in the
        batch picks it up. Scope creep is the standard failure of asking an
        assistant to improve something, so the boundary is worth writing even
        when it feels obvious.

  - type: textarea
    id: decisions
    attributes:
      label: Decisions to settle first
      description: >
        Anything with two defensible answers, so it is asked before code is
        written rather than found in review. A choice that changes what a verdict
        means, or what is allowed to run where, belongs here, not in a commit.
        Leave empty if there are none.
